# Application resources that GitLab CI re-applies on every release (see .gitlab-ci.yml).
# Namespace, NetworkPolicies, Service, and Ingress stay operator-managed in ../ so the CI identity cannot
# change what receives traffic or how it is filtered.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: manar-landing
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: manar-landing
      app.kubernetes.io/part-of: manar
resources:
  - service-account.yaml
  - deployment.yaml
  - pod-disruption-budget.yaml
  - horizontal-pod-autoscaler.yaml
# Bootstrap digest (image of commit 6d9920c, Trivy-clean) for the first manual install only. CI replaces the image with the digest it just
# built. Applying this directory by hand after CI has released would roll production back.
images:
  - name: registry.example.com/manar/landing
    digest: sha256:e9d850ef5ed8835760cecb0ae6e9f6b1ab2f8763dc413d4fdbccd693a5a71318
