# Example only. NOT listed in kustomization.yaml and never committed with real values.
# Prefer creating it imperatively (see deploy/README.md) so the key never touches disk.
apiVersion: v1
kind: Secret
metadata:
  name: manar-landing-email
  namespace: manar-landing
type: Opaque
stringData:
  acs-email-endpoint: "https://<resource>.communication.azure.com"
  acs-email-tenant-id: "<tenant id>"
  acs-email-client-id: "<landing app id>"
  acs-email-client-secret: "<set-me>"
  demo-from-email: "noreply@your-verified-domain"
