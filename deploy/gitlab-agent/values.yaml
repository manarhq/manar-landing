# Helm values for the gitlab/gitlab-agent chart (release name: manar-landing-production).
# Uses the pre-created ServiceAccount and token Secret; the chart's default cluster-admin RBAC is disabled.
serviceAccount:
  create: false
  name: manar-landing-production-agent

rbac:
  create: false

config:
  kasAddress: wss://gitlab.vax.sh/-/kubernetes-agent/
  secretName: gitlab-agent-token
  operational_container_scanning:
    enabled: false

replicas: 2

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 250m, memory: 256Mi}

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values: [k3s-worker-2, k3s-wnx]
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: gitlab-agent
