# Release permissions for CI jobs using the manar-landing-production agent.
# Update-only on the named application objects (they must already exist from the operator's
# first `kubectl apply -k deploy/k8s`). No create/delete, no Namespace, NetworkPolicy, Service, Ingress, RBAC,
# pod exec, or access to any Secret except the registry pull secret it refreshes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: manar-landing-production-release
  namespace: manar-landing
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [manar-landing]
    verbs: [get, watch, update, patch]
  # `kubectl rollout status` lists deployments; RBAC cannot narrow list by resourceNames,
  # so it is granted for this namespace only.
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [serviceaccounts]
    resourceNames: [manar-landing]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [gitlab-registry]
    verbs: [get, update, patch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    resourceNames: [manar-landing]
    verbs: [get, update, patch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    resourceNames: [manar-landing]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: manar-landing-production-release
  namespace: manar-landing
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: manar-landing-production-release
subjects:
  - kind: ServiceAccount
    name: manar-landing-production-agent
    namespace: gitlab-agent-manar-landing-production
