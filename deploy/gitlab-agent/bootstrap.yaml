# Agent namespace and identity. Applied once by an operator (see deploy/README.md).
apiVersion: v1
kind: Namespace
metadata:
  name: gitlab-agent-manar-landing-production
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.34
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.34
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.34
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: manar-landing-production-agent
  namespace: gitlab-agent-manar-landing-production
automountServiceAccountToken: false
---
# What the agent process itself needs (leader election, events) in its own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: manar-landing-production-agent-runtime
  namespace: gitlab-agent-manar-landing-production
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: manar-landing-production-agent-runtime
  namespace: gitlab-agent-manar-landing-production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: manar-landing-production-agent-runtime
subjects:
  - kind: ServiceAccount
    name: manar-landing-production-agent
    namespace: gitlab-agent-manar-landing-production
