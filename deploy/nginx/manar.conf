# /etc/nginx/conf.d/manar.conf on the edge (the edge VM), included inside http {}.
#
#   Internet -> Cloudflare (proxied, SSL mode Full (strict))
#            -> this edge :443 (Let's Encrypt manar.vax.sh + *.manar.vax.sh, certbot dns-cloudflare)
#            -> K3s ServiceLB / Traefik :8080 -> Ingress manar.vax.sh -> manar-landing pods
#
# Ships three snippets from this repo:
#   snippets/manar-realip.conf, snippets/manar-proxy.conf, snippets/manar-security-headers.conf
#
# Network fact (verified 2026-09-19): the router/firewall port-forwards 80/443 to this edge with source NAT,
# so every inbound connection, from Cloudflare or anyone else, arrives from the WAN address 94.59.105.209.
# The edge's global 00-cloudflare-real-ip.conf therefore never applies. manar-realip.conf trusts
# CF-Connecting-IP from that WAN address as well. Removing the source NAT on the port-forward (preserving
# the Cloudflare source address) is the proper fix; then drop 94.59.105.209 from both lists.
#
# Replaces the previous manar.conf (manar-web console, api., auth. on the App VM), which is retired.

upstream manar_k3s_traefik {
    zone manar_k3s_traefik 64k;
    least_conn;

    # Nodes publishing Traefik (kubectl -n kube-system get svc traefik), checked from this edge
    # on 2026-09-19. two nodes were removed from the cluster that day.
    server 192.0.2.46:8080 max_fails=3 fail_timeout=10s;
    server 192.0.2.32:8080 max_fails=3 fail_timeout=10s;
    server 192.0.2.138:8080 max_fails=3 fail_timeout=10s;

    keepalive 32;
}

# Who may connect to the manar.vax.sh origin: Cloudflare, the NATed WAN address (see above), plus the LAN
# and tailnet for operators. Direct IPv6 connections are not NATed and are still checked against Cloudflare.
# Keyed on the TCP peer ($realip_remote_addr), not the restored client IP.
# Cloudflare list: https://www.cloudflare.com/ips-v4 and /ips-v6 (fetched 2026-09-17);
# keep it identical to conf.d/00-cloudflare-real-ip.conf.
geo $realip_remote_addr $manar_origin_allowed {
    default 0;
    127.0.0.0/8 1;
    ::1 1;
    192.0.2.0/24 1;
    100.64.0.0/10 1;
    94.59.105.209 1;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# Demo form: shared limit across replicas, keyed on the restored visitor IP.
limit_req_zone $binary_remote_addr zone=manar_demo_request:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name manar.vax.sh;

    include /etc/nginx/snippets/manar-realip.conf;

    access_log /var/log/nginx/manar.vax.sh.access.log;
    error_log /var/log/nginx/manar.vax.sh.error.log warn;

    if ($manar_origin_allowed = 0) {
        return 444;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name manar.vax.sh;

    ssl_certificate     /etc/letsencrypt/live/manar.vax.sh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manar.vax.sh/privkey.pem;
    ssl_session_cache shared:manar_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/manar-realip.conf;

    access_log /var/log/nginx/manar.vax.sh.access.log;
    error_log /var/log/nginx/manar.vax.sh.error.log warn;

    # Direct-to-origin connections that did not come through Cloudflare (or the LAN/tailnet) are dropped.
    if ($manar_origin_allowed = 0) {
        return 444;
    }

    client_max_body_size 1m;
    client_body_timeout 10s;
    keepalive_timeout 65s;
    send_timeout 60s;

    location = /_edge-health {
        access_log off;
        return 204;
    }

    # Hashed build assets: immutable, cacheable for a year by Cloudflare and browsers.
    location ^~ /_next/static/ {
        include /etc/nginx/snippets/manar-proxy.conf;
        include /etc/nginx/snippets/manar-security-headers.conf;
    }

    location = /api/demo-request {
        limit_except POST {
            deny all;
        }
        limit_req zone=manar_demo_request burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;

        include /etc/nginx/snippets/manar-proxy.conf;
        include /etc/nginx/snippets/manar-security-headers.conf;
    }

    # Other API routes set their own Cache-Control (no-store).
    location ^~ /api/ {
        include /etc/nginx/snippets/manar-proxy.conf;
        include /etc/nginx/snippets/manar-security-headers.conf;
    }

    location / {
        include /etc/nginx/snippets/manar-proxy.conf;
        include /etc/nginx/snippets/manar-security-headers.conf;

        # Prerendered pages carry Next's "s-maxage=31536000"; make Cloudflare and browsers revalidate
        # so each release is visible immediately.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }
}

# Retired hosts (api., auth., and any other *.manar.vax.sh name) still match the wildcard certificate.
# Close them explicitly so they never fall through to another site's default server.
server {
    listen 80;
    listen [::]:80;
    server_name *.manar.vax.sh;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name *.manar.vax.sh;

    ssl_certificate     /etc/letsencrypt/live/manar.vax.sh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manar.vax.sh/privkey.pem;

    access_log off;
    return 444;
}
