# Included in every location that sets add_header, because add_header in a
# location replaces (does not merge with) headers declared at server level.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# The previous manar.vax.sh config already sent HSTS, so browsers expect it; keep it.
add_header Strict-Transport-Security "max-age=31536000" always;
