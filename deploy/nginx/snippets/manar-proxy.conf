proxy_pass http://manar_k3s_traefik;
proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host $host;
# $remote_addr is the real visitor here: realip restored it from CF-Connecting-IP,
# and only for connections that actually came from Cloudflare.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Port 443;
# Traefik (no forwardedHeaders.trustedIPs) rewrites X-Forwarded-*/X-Real-IP, but passes
# this header through. The app keys its demo-request rate limit on it
# (TRUSTED_CLIENT_IP_HEADER). Always overwritten here, so clients cannot spoof it.
proxy_set_header X-Edge-Client-IP $remote_addr;

proxy_connect_timeout 3s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
proxy_next_upstream_tries 3;
proxy_hide_header X-Powered-By;
