# Edge Nginx for manar.vax.sh. Include inside the http context, for example
#   /etc/nginx/conf.d/manar.vax.sh.conf
# with the snippets at /etc/nginx/snippets/.
#
# Path: Internet -> Cloudflare (proxied, SSL mode Full (strict))
#       -> this edge on :443 (Cloudflare Origin CA certificate)
#       -> K3s ServiceLB / Traefik on :8080 -> Ingress manar.vax.sh -> manar-landing pods.

upstream manar_k3s_traefik {
    zone manar_k3s_traefik 64k;
    least_conn;

    # Nodes where the Traefik LoadBalancer Service is published (kubectl get svc -n kube-system
    # traefik, 2026-09-17): k3s-cp1, k3s-worker-1, k3s-worker-2. ctf (.105) is NotReady and
    # k3s-wnx (.77) is unreachable, so neither is listed.
    server 192.168.0.46:8080 max_fails=3 fail_timeout=10s;
    server 192.168.0.32:8080 max_fails=3 fail_timeout=10s;
    server 192.168.0.138:8080 max_fails=3 fail_timeout=10s;

    keepalive 32;
}

# Cloudflare egress ranges, from https://www.cloudflare.com/ips-v4 and /ips-v6 (fetched
# 2026-09-17). Keep this list and the set_real_ip_from list below identical and refresh both
# periodically. Keyed on the TCP peer, not the rewritten client address.
geo $realip_remote_addr $manar_via_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# Shared edge protection for the demo form (the in-pod limiter is per replica).
# Keyed on the restored visitor IP.
limit_req_zone $binary_remote_addr zone=manar_demo_request:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name manar.vax.sh;
    server_tokens off;

    include /etc/nginx/snippets/manar-realip.conf;

    access_log /var/log/nginx/manar.vax.sh.access.log;
    error_log /var/log/nginx/manar.vax.sh.error.log warn;

    if ($manar_via_cloudflare = 0) {
        return 444;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name manar.vax.sh;
    server_tokens off;

    # Cloudflare Origin CA certificate for manar.vax.sh (trusted by Cloudflare only).
    ssl_certificate /etc/nginx/ssl/cloudflare/manar.vax.sh.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare/manar.vax.sh.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:manar_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Optional hardening: Cloudflare Authenticated Origin Pulls. Enable the feature in the
    # Cloudflare dashboard first, install Cloudflare's origin-pull CA, then uncomment.
    # ssl_client_certificate /etc/nginx/ssl/cloudflare/origin-pull-ca.pem;
    # ssl_verify_client on;

    include /etc/nginx/snippets/manar-realip.conf;

    access_log /var/log/nginx/manar.vax.sh.access.log;
    error_log /var/log/nginx/manar.vax.sh.error.log warn;

    # Refuse anything that did not come through Cloudflare (direct-to-origin scans, spoofed
    # CF-Connecting-IP). Also restrict :80/:443 to Cloudflare ranges in the edge firewall.
    if ($manar_via_cloudflare = 0) {
        return 444;
    }

    client_max_body_size 1m;
    client_body_timeout 10s;
    keepalive_timeout 65s;
    send_timeout 60s;

    location = /_edge-health {
        access_log off;
        return 204;
    }

    # Hashed build assets: safe to cache for a year at Cloudflare and in browsers.
    location ^~ /_next/static/ {
        include /etc/nginx/snippets/manar-proxy.conf;
        include /etc/nginx/snippets/manar-security-headers.conf;
    }

    location = /api/demo-request {
        limit_except POST {
            deny all;
        }
        limit_req zone=manar_demo_request burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;

        include /etc/nginx/snippets/manar-proxy.conf;
        include /etc/nginx/snippets/manar-security-headers.conf;
    }

    # Other API routes set their own Cache-Control (no-store).
    location ^~ /api/ {
        include /etc/nginx/snippets/manar-proxy.conf;
        include /etc/nginx/snippets/manar-security-headers.conf;
    }

    location / {
        include /etc/nginx/snippets/manar-proxy.conf;
        include /etc/nginx/snippets/manar-security-headers.conf;

        # Prerendered pages carry Next's default "s-maxage=31536000". Replace it so Cloudflare
        # and browsers revalidate and a new release is visible immediately.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }
}
